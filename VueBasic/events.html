<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event VueJS</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.0/dist/vue.js"></script>
    <style>
      .box {
        width: 200px;
        height: 200px;
        position: relative;
        background-color: lightgray;
        margin-top: 20px;
      }

      .box-2 {
        width: 50px;
        height: 50px;
        background-color: red;
        right: 0;
        top: 0;
        position: absolute;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Count:{{ counter }}</h1>
      <button v-on:click="handleClick($event,3)">Click Me</button>
      <div class="box" v-on:mousemove="handleMouseMove">
        <p>X: {{ clientX }}</p>
        <p>Y: {{ clientY }}</p>
        <div class="box-2" v-on:mousemove.stop="handleMouseMoveChild"></div>
      </div>
      <form
        action="https://www.youtube.com/watch?v=6M0PAQDLla8&list=PLv6GftO355AtDjStqeyXvhA1oRLuhvJWf&index=9"
        v-on:submit.prevent="handleSubmitForm"
      >
        <label>Nhap First Name</label>
        <input type="text" name="FirstName" /> <br />
        <label>Nhap email</label>
        <input type="text" name="Email" /> <br />
        <input type="submit" value="Dang Nhap" />
      </form>
    </div>
  </body>
  <script>
    var app = new Vue({
      el: "#app",
      data: {
        counter: 0,
        clientX: 0,
        clientY: 0,
      },
      methods: {
        handleClick(e, number) {
          this.counter += number;
        },
        handleMouseMove(e) {
          this.clientX = e.clientX;
          this.clientY = e.clientY;
        },
        handleSubmitForm(e) {
          console.log(e);
        },
        handleMouseMoveChild(e) {
          e.stopPropagation();
          this.clientX = e.clientX;
          this.clientY = e.clientY;
        },
      },
    });
  </script>
</html>
